# หอพุทธศิลป์ · ทัวร์ 360° — ตั้งค่า Nginx
# 1) คัดลอก deploy/dist/ ไปไว้ที่ /var/www/bda-360
# 2) คัดลอกไฟล์นี้ไปที่ /etc/nginx/sites-available/ แล้ว ln -s ไป sites-enabled/
# 3) แก้ server_name เป็นโดเมนจริง แล้ว sudo nginx -t && sudo systemctl reload nginx
# 4) เปิด HTTPS ด้วย: sudo certbot --nginx -d tour.example.ac.th

server {
    listen 80;
    listen [::]:80;
    server_name tour.example.ac.th;          # ← แก้เป็นโดเมนจริง

    root /var/www/bda-360;                   # ← โฟลเดอร์ที่วางไฟล์จาก deploy/dist/
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # (ห้ามใช้ add_header ใน location ย่อย ไม่เช่นนั้น header เหล่านี้จะหาย)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
        expires -1;                          # หน้า html ตรวจของใหม่ทุกครั้ง
    }

    # ภาพ 360° (ไฟล์ใหญ่) เก็บแคช 30 วัน
    location /images/ {
        expires 30d;
        access_log off;
    }

    # css/js มีเลขเวอร์ชัน (?v=) จาก build.sh จึงเก็บแคชได้นาน
    location ~* \.(css|js)$ {
        expires 1y;
    }

    # ไม่ให้เปิดไฟล์ซ่อน
    location ~ /\. {
        deny all;
    }
}
